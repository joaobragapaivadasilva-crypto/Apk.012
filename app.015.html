<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Recibo Profissional - Sistema Avançado</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', 'Roboto', 'Times New Roman', serif;
    background: #e9ecef;
    padding: 30px 20px;
    min-height: 100vh;
}

.container {
    max-width: 1100px;
    margin: 0 auto;
}

/* Área da Logo / Cabeçalho da Empresa */
.empresa-header {
    background: white;
    border-radius: 12px;
    margin-bottom: 24px;
    padding: 16px 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    border: 1px solid #dee2e6;
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
}

.logo-area {
    flex-shrink: 0;
    position: relative;
}

.logo-preview {
    width: 80px;
    height: 80px;
    border: 2px dashed #dee2e6;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s;
    background: #f8f9fa;
    overflow: hidden;
}

.logo-preview:hover {
    border-color: #0d6efd;
}

.logo-preview img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.logo-preview .placeholder {
    text-align: center;
    color: #adb5bd;
    font-size: 10px;
    padding: 10px;
}

.logo-preview .placeholder span {
    font-size: 24px;
    display: block;
    margin-bottom: 4px;
}

.logo-actions {
    margin-top: 5px;
    display: flex;
    gap: 5px;
    justify-content: center;
}

.logo-actions button {
    padding: 2px 6px;
    font-size: 9px;
    background: #f8f9fa;
    border: 1px solid #dee2e6;
    border-radius: 4px;
    cursor: pointer;
}

.btn-remove-logo {
    color: #dc3545;
}

.empresa-info {
    flex: 1;
}

.empresa-info input {
    width: 100%;
    margin-bottom: 8px;
    padding: 8px 12px;
    border: 1px solid #ced4da;
    border-radius: 6px;
    font-size: 13px;
    font-family: inherit;
}

.empresa-info input:last-child {
    margin-bottom: 0;
}

/* Layout de duas colunas para desktop */
.layout {
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 24px;
    align-items: start;
}

/* Formulário */
.formulario {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    border: 1px solid #dee2e6;
    position: sticky;
    top: 20px;
}

h1 {
    margin-bottom: 16px;
    font-size: 18px;
    color: #212529;
    font-weight: 600;
    border-left: 4px solid #0d6efd;
    padding-left: 12px;
}

.campo {
    margin-bottom: 12px;
}

label {
    display: block;
    margin-bottom: 4px;
    font-weight: 600;
    font-size: 11px;
    color: #495057;
}

label .obrigatorio {
    color: #dc3545;
}

input, select, textarea {
    width: 100%;
    padding: 7px 10px;
    border: 1px solid #ced4da;
    border-radius: 6px;
    font-size: 12px;
    font-family: inherit;
}

input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: #0d6efd;
    box-shadow: 0 0 0 3px rgba(13,110,253,0.1);
}

textarea {
    resize: vertical;
    min-height: 50px;
}

.botoes {
    display: flex;
    gap: 8px;
    margin-top: 16px;
}

button {
    flex: 1;
    padding: 7px 10px;
    border: none;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
}

.btn-salvar { background: #0d6efd; color: white; }
.btn-limpar { background: #6c757d; color: white; }
.btn-pdf { background: #198754; color: white; }
.btn-historico { background: #6f42c1; color: white; }

button:hover {
    transform: translateY(-1px);
    filter: brightness(1.05);
}

/* Histórico */
.historico {
    background: white;
    border-radius: 12px;
    border: 1px solid #dee2e6;
    overflow: hidden;
    margin-bottom: 20px;
}

.historico-header {
    background: #f8f9fa;
    padding: 10px 14px;
    border-bottom: 1px solid #dee2e6;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.historico-header h3 {
    font-size: 13px;
    margin: 0;
}

.btn-limpar-historico {
    background: none;
    border: none;
    color: #dc3545;
    font-size: 10px;
    cursor: pointer;
    padding: 3px 6px;
}

.lista-recibos {
    max-height: 350px;
    overflow-y: auto;
    padding: 6px;
}

.item-recibo {
    background: #f8f9fa;
    border: 1px solid #e9ecef;
    border-radius: 6px;
    padding: 8px;
    margin-bottom: 6px;
    cursor: pointer;
    transition: all 0.2s;
}

.item-recibo:hover {
    background: #e9ecef;
    transform: translateX(2px);
}

.item-recibo .info {
    display: flex;
    justify-content: space-between;
    margin-bottom: 4px;
}

.item-recibo .numero {
    font-weight: 600;
    font-size: 11px;
    color: #0d6efd;
}

.item-recibo .valor {
    font-weight: 700;
    font-size: 11px;
    color: #198754;
}

.item-recibo .cliente {
    font-size: 10px;
    color: #6c757d;
}

/* Área dos recibos - EMPILHADOS */
.recibos-area {
    background: transparent;
}

.recibos-empilhados {
    display: flex;
    flex-direction: column;
    gap: 0;
}

/* ESTILO DO RECIBO COM BORDA ARREDONDADA - COMPACTADO PARA CABER 2 VIAS EM 1 FOLHA */
.recibo-item {
    background: white;
    border: 2px solid #343a40;
    border-radius: 16px;
    padding: 12px 18px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

.recibo-item:last-child {
    margin-bottom: 0;
}

.recibo-via {
    text-align: center;
    font-size: 9px;
    font-weight: 700;
    color: #0d6efd;
    margin-bottom: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    background: #f1f3f5;
    display: inline-block;
    width: auto;
    padding: 2px 14px;
    border-radius: 30px;
    margin-left: auto;
    margin-right: auto;
}

.recibo-formal {
    font-family: 'Times New Roman', 'Georgia', 'Segoe UI', serif;
    font-size: 10px;
}

.recibo-formal .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1.5px solid #212529;
    gap: 12px;
}

.recibo-formal .logo-area-recibo {
    flex-shrink: 0;
}

.recibo-formal .logo-img {
    max-width: 45px;
    max-height: 40px;
    object-fit: contain;
}

.recibo-formal .logo-placeholder {
    width: 45px;
    height: 40px;
    background: #f8f9fa;
    border: 1px solid #dee2e6;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: #adb5bd;
}

.recibo-formal .titulo-area {
    text-align: center;
    flex: 1;
}

.recibo-formal .titulo-area h2 {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 3px;
    color: #000;
    font-family: 'Times New Roman', 'Georgia', serif;
}

.recibo-formal .empresa-nome {
    font-size: 10px;
    font-weight: 600;
    color: #0d6efd;
    margin-top: 2px;
}

.recibo-formal .empresa-slogan {
    font-size: 8px;
    color: #6c757d;
    font-style: italic;
}

.recibo-formal .info-topo {
    display: flex;
    justify-content: space-between;
    background: #f8f9fa;
    padding: 5px 10px;
    margin-bottom: 10px;
    border-left: 3px solid #212529;
    border-radius: 6px;
}

.recibo-formal .numero-recibo {
    font-weight: 600;
    font-size: 10px;
    color: #495057;
}

.recibo-formal .valor-recibo {
    font-weight: 700;
    font-size: 14px;
    color: #198754;
}

.recibo-formal .grid-info {
    display: grid;
    grid-template-columns: 80px 1fr;
    gap: 6px;
    margin-bottom: 8px;
}

.recibo-formal .grid-label {
    font-weight: 600;
    font-size: 9px;
    color: #495057;
    text-transform: uppercase;
    letter-spacing: 0.3px;
}

.recibo-formal .grid-value {
    font-size: 10px;
    border-bottom: 1px dotted #dee2e6;
    padding: 2px 0;
    color: #000;
}

/* NOME E CPF LADO A LADO - MAIS PRÓXIMO E COMPACTO */
.emitente-dados {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 20px;
    background: #fef9e6;
    padding: 6px 12px;
    margin: 8px 0 5px 0;
    border-radius: 10px;
    border: 1px solid #ffecb3;
    flex-wrap: wrap;
}

.emitente-nome {
    font-size: 10px;
    font-weight: 700;
    color: #000;
    display: flex;
    gap: 6px;
    align-items: baseline;
}

.emitente-nome strong {
    font-size: 10px;
    font-weight: 800;
    color: #1e466e;
    background: white;
    padding: 1px 5px;
    border-radius: 16px;
}

.emitente-cpf {
    font-size: 10px;
    font-family: monospace;
    background: white;
    padding: 2px 8px;
    border-radius: 16px;
    color: #2c3e66;
    font-weight: 600;
}

.recibo-formal .forma-pagamento {
    display: inline-block;
    background: #e9ecef;
    padding: 3px 10px;
    font-size: 9px;
    margin: 6px 0;
    border-radius: 20px;
    border: 1px solid #ced4da;
}

.recibo-formal .extenso {
    background: #f8f9fa;
    padding: 5px 10px;
    margin: 8px 0;
    border-left: 3px solid #212529;
    border-radius: 6px;
}

.recibo-formal .extenso-label {
    font-size: 9px;
    font-weight: 600;
    color: #1e466e;
    text-transform: none;
    letter-spacing: normal;
    margin-bottom: 3px;
}

.recibo-formal .extenso-value {
    font-size: 9px;
    color: #000;
    font-style: italic;
    font-weight: 500;
}

.recibo-formal .observacao {
    margin: 8px 0;
    padding: 4px 10px;
    background: #f8f9fa;
    font-size: 9px;
    color: #495057;
    border-left: 2px solid #dee2e6;
    border-radius: 5px;
}

.recibo-formal .assinatura {
    margin-top: 10px;
    text-align: center;
}

.recibo-formal .assinatura p {
    border-top: 1px solid #000;
    display: inline-block;
    padding-top: 4px;
    min-width: 130px;
    font-size: 8px;
    color: #6c757d;
}

.recibo-formal .footer {
    margin-top: 8px;
    text-align: center;
    font-size: 7px;
    color: #adb5bd;
}

/* Notificações */
.notificacao {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #28a745;
    color: white;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 12px;
    z-index: 1000;
    animation: slideIn 0.3s ease;
}

.notificacao.erro {
    background: #dc3545;
}

@keyframes slideIn {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
}

/* IMPRESSÃO - AS DUAS VIAS NA MESMA FOLHA, UMA ACIMA DA OUTRA, SEM QUEBRA */
@media print {
    @page {
        size: A4;
        margin: 0.8cm;
    }
    
    body {
        background: white;
        padding: 0;
        margin: 0;
    }
    
    .empresa-header, .formulario, .botoes, .historico, .notificacao, .logo-actions {
        display: none;
    }
    
    .layout {
        display: block;
    }
    
    .recibos-area {
        padding: 0;
    }
    
    .recibos-empilhados {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    
    .recibo-item {
        border: 1.5px solid #212121;
        border-radius: 16px;
        box-shadow: none;
        page-break-inside: avoid;
        page-break-after: avoid;
        break-inside: avoid;
        margin-bottom: 0;
        padding: 10px 16px;
        background: white;
    }
    
    .recibo-item:first-child {
        margin-bottom: 12px;
    }
    
    .recibo-item:last-child {
        margin-bottom: 0;
    }
    
    .recibo-formal .header {
        border-bottom: 1.5px solid #000;
    }
    
    .recibo-formal .info-topo {
        border-left: 3px solid #000;
    }
    
    .recibo-formal .extenso {
        border-left: 3px solid #000;
    }
    
    .recibo-formal .assinatura p {
        border-top: 1px solid #000;
    }
    
    .emitente-dados {
        background: #f5f5f5;
        border: 1px solid #ddd;
        padding: 5px 10px;
    }
}

/* Responsivo */
@media (max-width: 800px) {
    .layout {
        grid-template-columns: 1fr;
    }
    
    .formulario {
        position: static;
    }
    
    .empresa-header {
        flex-direction: column;
        text-align: center;
    }
    
    .logo-area {
        margin: 0 auto;
    }
    
    .recibo-item {
        padding: 12px 14px;
    }
}
</style>
</head>
<body>
<div class="container">
    <!-- Cabeçalho da Empresa -->
    <div class="empresa-header">
        <div class="logo-area">
            <div class="logo-preview" id="logoPreview" onclick="document.getElementById('logoUpload').click()">
                <div id="logoPlaceholder" class="placeholder">
                    <span>🏢</span>
                    <small>Logo</small>
                </div>
                <img id="logoImage" style="display: none;" alt="Logo">
            </div>
            <input type="file" id="logoUpload" accept="image/png, image/jpeg" style="display: none;">
            <div class="logo-actions">
                <button onclick="removerLogo()" class="btn-remove-logo">Remover</button>
            </div>
        </div>
        <div class="empresa-info">
            <input type="text" id="empresaNome" placeholder="Nome da empresa / Profissional">
            <input type="text" id="empresaSlogan" placeholder="Slogan (opcional)">
        </div>
    </div>
    
    <div class="layout">
        <!-- Formulário -->
        <div class="formulario">
            <h1>Recibo Profissional</h1>
            
            <div class="campo">
                <label>Nº do Recibo <span class="obrigatorio">*</span></label>
                <input type="number" id="numero" value="1">
            </div>
            
            <div class="campo">
                <label>Data <span class="obrigatorio">*</span></label>
                <input type="date" id="data">
            </div>
            
            <div class="campo">
                <label>Valor (R$) <span class="obrigatorio">*</span></label>
                <input type="text" id="valor" placeholder="0,00">
            </div>
            
            <div class="campo">
                <label>Forma de Pagamento</label>
                <select id="formaPagamento">
                    <option value="">Selecione...</option>
                    <option value="Dinheiro">Dinheiro</option>
                    <option value="Pix">Pix</option>
                    <option value="Cartão de Crédito">Cartão de Crédito</option>
                    <option value="Cartão de Débito">Cartão de Débito</option>
                    <option value="Transferência Bancária">Transferência Bancária</option>
                </select>
            </div>
            
            <div class="campo">
                <label>Recebi de <span class="obrigatorio">*</span></label>
                <input type="text" id="recebidoDe" placeholder="Nome da pessoa ou empresa">
            </div>
            
            <div class="campo">
                <label>Referente a <span class="obrigatorio">*</span></label>
                <textarea id="referente" placeholder="Descrição do serviço/produto"></textarea>
            </div>
            
            <div class="campo">
                <label>Observações</label>
                <textarea id="observacoes" placeholder="Informações adicionais"></textarea>
            </div>
            
            <div class="campo">
                <label>Seu nome <span class="obrigatorio">*</span></label>
                <input type="text" id="nome" placeholder="Nome completo">
            </div>
            
            <div class="campo">
                <label>CPF / CNPJ <span class="obrigatorio">*</span></label>
                <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="18">
            </div>
            
            <div class="botoes">
                <button class="btn-salvar" onclick="salvarRecibo()">Salvar</button>
                <button class="btn-pdf" onclick="gerarPDF()">Imprimir</button>
            </div>
            <div class="botoes" style="margin-top: 6px;">
                <button class="btn-limpar" onclick="limparFormulario()">Limpar</button>
                <button class="btn-historico" onclick="toggleHistorico()">Histórico</button>
            </div>
        </div>
        
        <!-- Lado direito -->
        <div>
            <!-- Histórico -->
            <div class="historico" id="historicoPanel" style="display: none;">
                <div class="historico-header">
                    <h3>📋 Histórico de Recibos</h3>
                    <button class="btn-limpar-historico" onclick="limparHistorico()">Limpar</button>
                </div>
                <div class="lista-recibos" id="listaRecibos"></div>
            </div>
            
            <!-- Área dos recibos -->
            <div class="recibos-area" id="recibosArea"></div>
        </div>
    </div>
</div>

<script>
// ==================== VARIÁVEIS GLOBAIS ====================
let recibosEmitidos = [];
let logoDataURL = null;

// ==================== LOGO ====================
document.getElementById('logoUpload').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file && (file.type === 'image/png' || file.type === 'image/jpeg')) {
        const reader = new FileReader();
        reader.onload = function(event) {
            logoDataURL = event.target.result;
            document.getElementById('logoImage').src = logoDataURL;
            document.getElementById('logoImage').style.display = 'block';
            document.getElementById('logoPlaceholder').style.display = 'none';
            localStorage.setItem('empresaLogo', logoDataURL);
            montarRecibos();
            mostrarNotificacao('Logo adicionada!');
        };
        reader.readAsDataURL(file);
    } else {
        mostrarNotificacao('Selecione PNG ou JPG', 'erro');
    }
});

function removerLogo() {
    logoDataURL = null;
    document.getElementById('logoImage').style.display = 'none';
    document.getElementById('logoPlaceholder').style.display = 'flex';
    localStorage.removeItem('empresaLogo');
    montarRecibos();
    mostrarNotificacao('Logo removida');
}

function carregarLogo() {
    const logoSalva = localStorage.getItem('empresaLogo');
    if (logoSalva) {
        logoDataURL = logoSalva;
        document.getElementById('logoImage').src = logoDataURL;
        document.getElementById('logoImage').style.display = 'block';
        document.getElementById('logoPlaceholder').style.display = 'none';
    }
}

// ==================== VALIDAÇÕES ====================
function validarCPF(cpf) {
    cpf = cpf.replace(/[^\d]/g, '');
    if (cpf.length !== 11) return false;
    if (/^(\d)\1{10}$/.test(cpf)) return false;
    
    let soma = 0;
    for (let i = 0; i < 9; i++) soma += parseInt(cpf.charAt(i)) * (10 - i);
    let resto = 11 - (soma % 11);
    let digito1 = resto === 10 || resto === 11 ? 0 : resto;
    if (digito1 !== parseInt(cpf.charAt(9))) return false;
    
    soma = 0;
    for (let i = 0; i < 10; i++) soma += parseInt(cpf.charAt(i)) * (11 - i);
    resto = 11 - (soma % 11);
    let digito2 = resto === 10 || resto === 11 ? 0 : resto;
    return digito2 === parseInt(cpf.charAt(10));
}

function validarCamposObrigatorios() {
    const campos = ['recebidoDe', 'referente', 'nome', 'cpf'];
    for (let campo of campos) {
        if (!document.getElementById(campo).value.trim()) {
            mostrarNotificacao('Preencha todos os campos obrigatórios', 'erro');
            return false;
        }
    }
    
    const valorNum = limparValor(document.getElementById('valor').value);
    if (valorNum === 0) {
        mostrarNotificacao('Informe um valor válido', 'erro');
        return false;
    }
    
    const cpf = document.getElementById('cpf').value;
    if (cpf && !validarCPF(cpf) && cpf.replace(/\D/g, '').length === 11) {
        mostrarNotificacao('CPF inválido!', 'erro');
        return false;
    }
    
    return true;
}

// ==================== MÁSCARAS ====================
function aplicarMascaraCPF(valor) {
    valor = valor.replace(/\D/g, '');
    if (valor.length <= 3) return valor;
    if (valor.length <= 6) return valor.replace(/(\d{3})(\d)/, '$1.$2');
    if (valor.length <= 9) return valor.replace(/(\d{3})(\d{3})(\d)/, '$1.$2.$3');
    return valor.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, '$1.$2.$3-$4');
}

function limparValor(valor) {
    if (!valor) return 0;
    let v = valor.toString().replace(/[^\d,]/g, '');
    v = v.replace(',', '.');
    let num = parseFloat(v);
    return isNaN(num) ? 0 : num;
}

function formatarValor(valor) {
    let num = limparValor(valor);
    return num.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

// ==================== VALOR POR EXTENSO ====================
function valorExtenso(valor) {
    let num = limparValor(valor);
    let reais = Math.floor(num);
    let centavos = Math.round((num - reais) * 100);
    
    const numeros = ['zero', 'um', 'dois', 'três', 'quatro', 'cinco', 'seis', 'sete', 'oito', 'nove'];
    const especiais = ['dez', 'onze', 'doze', 'treze', 'quatorze', 'quinze', 'dezesseis', 'dezessete', 'dezoito', 'dezenove'];
    const dezenas = ['', '', 'vinte', 'trinta', 'quarenta', 'cinquenta', 'sessenta', 'setenta', 'oitenta', 'noventa'];
    const centenas = ['', 'cento', 'duzentos', 'trezentos', 'quatrocentos', 'quinhentos', 'seiscentos', 'setecentos', 'oitocentos', 'novecentos'];
    
    function escreverNumero(n) {
        if (n === 0) return '';
        if (n === 100) return 'cem';
        
        let texto = '';
        let cent = Math.floor(n / 100);
        let resto = n % 100;
        
        if (cent > 0) {
            texto += centenas[cent];
            if (resto > 0) texto += ' e ';
        }
        
        if (resto >= 10 && resto <= 19) {
            texto += especiais[resto - 10];
        } else {
            let dez = Math.floor(resto / 10);
            let uni = resto % 10;
            if (dez > 0) {
                texto += dezenas[dez];
                if (uni > 0) texto += ' e ' + numeros[uni];
            } else if (uni > 0) {
                texto += numeros[uni];
            }
        }
        return texto;
    }
    
    let textoReais = '';
    
    if (reais === 0) {
        textoReais = 'zero reais';
    } else {
        if (reais >= 1000) {
            let milhares = Math.floor(reais / 1000);
            let restoMilhar = reais % 1000;
            if (milhares === 1) {
                textoReais += 'um mil';
            } else {
                textoReais += escreverNumero(milhares) + ' mil';
            }
            if (restoMilhar > 0) {
                if (restoMilhar < 100) textoReais += ' e ' + escreverNumero(restoMilhar);
                else textoReais += ' ' + escreverNumero(restoMilhar);
            }
        } else {
            textoReais += escreverNumero(reais);
        }
        textoReais += reais === 1 ? ' real' : ' reais';
    }
    
    if (centavos > 0) {
        if (reais > 0) textoReais += ' e ';
        textoReais += escreverNumero(centavos) + (centavos === 1 ? ' centavo' : ' centavos');
    }
    
    return textoReais.charAt(0).toUpperCase() + textoReais.slice(1);
}

// ==================== NOTIFICAÇÕES ====================
function mostrarNotificacao(mensagem, tipo = 'sucesso') {
    const notificacao = document.createElement('div');
    notificacao.className = `notificacao ${tipo === 'erro' ? 'erro' : ''}`;
    notificacao.innerText = mensagem;
    document.body.appendChild(notificacao);
    setTimeout(() => notificacao.remove(), 3000);
}

// ==================== RECIBOS ====================
function salvarRecibo() {
    if (!validarCamposObrigatorios()) return;
    
    const recibo = {
        id: Date.now(),
        numero: document.getElementById('numero').value,
        data: document.getElementById('data').value,
        valor: document.getElementById('valor').value,
        formaPagamento: document.getElementById('formaPagamento').value,
        recebidoDe: document.getElementById('recebidoDe').value,
        referente: document.getElementById('referente').value,
        observacoes: document.getElementById('observacoes').value,
        nome: document.getElementById('nome').value,
        cpf: document.getElementById('cpf').value,
        empresaNome: document.getElementById('empresaNome').value,
        empresaSlogan: document.getElementById('empresaSlogan').value,
        dataEmissao: new Date().toISOString()
    };
    
    recibosEmitidos.unshift(recibo);
    localStorage.setItem('recibosEmitidos', JSON.stringify(recibosEmitidos));
    localStorage.setItem('empresaNome', recibo.empresaNome);
    localStorage.setItem('empresaSlogan', recibo.empresaSlogan);
    
    const dadosAtuais = {
        numero: recibo.numero, data: recibo.data, valor: recibo.valor,
        recebidoDe: recibo.recebidoDe, referente: recibo.referente,
        nome: recibo.nome, cpf: recibo.cpf
    };
    localStorage.setItem('reciboDados', JSON.stringify(dadosAtuais));
    
    montarRecibos();
    atualizarListaHistorico();
    document.getElementById('numero').value = parseInt(recibo.numero) + 1;
    mostrarNotificacao('Recibo salvo!');
}

function carregarReciboParaEdicao(recibo) {
    document.getElementById('numero').value = recibo.numero;
    document.getElementById('data').value = recibo.data;
    document.getElementById('valor').value = recibo.valor;
    document.getElementById('formaPagamento').value = recibo.formaPagamento || '';
    document.getElementById('recebidoDe').value = recibo.recebidoDe;
    document.getElementById('referente').value = recibo.referente;
    document.getElementById('observacoes').value = recibo.observacoes || '';
    document.getElementById('nome').value = recibo.nome;
    document.getElementById('cpf').value = recibo.cpf;
    montarRecibos();
    mostrarNotificacao('Recibo carregado');
    if (window.innerWidth <= 800) toggleHistorico();
}

function limparHistorico() {
    if (confirm('Limpar todo o histórico?')) {
        recibosEmitidos = [];
        localStorage.removeItem('recibosEmitidos');
        atualizarListaHistorico();
        mostrarNotificacao('Histórico limpo!');
    }
}

function atualizarListaHistorico() {
    const lista = document.getElementById('listaRecibos');
    if (!lista) return;
    
    if (recibosEmitidos.length === 0) {
        lista.innerHTML = '<div style="text-align: center; padding: 20px; color: #6c757d;">Nenhum recibo emitido</div>';
        return;
    }
    
    lista.innerHTML = recibosEmitidos.map(recibo => `
        <div class="item-recibo" onclick='carregarReciboParaEdicao(${JSON.stringify(recibo)})'>
            <div class="info">
                <span class="numero">Nº ${recibo.numero}</span>
                <span class="valor">R$ ${formatarValor(recibo.valor)}</span>
            </div>
            <div class="cliente">${recibo.recebidoDe.substring(0, 40)}</div>
            <div class="data">${new Date(recibo.data).toLocaleDateString('pt-BR')}</div>
        </div>
    `).join('');
}

// ==================== MONTAR RECIBOS (COMPACTO - 2 VIAS CABEM NA MESMA FOLHA) ====================
function montarRecibos() {
    const numero = document.getElementById('numero').value || '1';
    const dataRaw = document.getElementById('data').value;
    const valorRaw = document.getElementById('valor').value || '0';
    const formaPagamento = document.getElementById('formaPagamento').value;
    const observacoes = document.getElementById('observacoes').value;
    const empresaNome = document.getElementById('empresaNome').value;
    const empresaSlogan = document.getElementById('empresaSlogan').value;
    const recebidoDe = document.getElementById('recebidoDe').value || '____________________';
    const referente = document.getElementById('referente').value || '____________________';
    const nome = document.getElementById('nome').value || '____________________';
    const cpf = document.getElementById('cpf').value || '____________________';
    
    let data = '';
    if (dataRaw) {
        const dataObj = new Date(dataRaw + 'T00:00:00');
        if (!isNaN(dataObj.getTime())) data = dataObj.toLocaleDateString('pt-BR');
    }
    if (!data) data = new Date().toLocaleDateString('pt-BR');
    
    const valorFormatado = formatarValor(valorRaw);
    const valorExt = valorExtenso(valorRaw);
    const dataHoje = new Date().toLocaleDateString('pt-BR');
    
    const logoSrc = logoDataURL;
    const logoSvg = logoSrc ? 
        `<img src="${logoSrc}" class="logo-img" alt="Logo">` : 
        `<div class="logo-placeholder">🏢</div>`;
    
    const sloganHtml = empresaSlogan ? `<div class="empresa-slogan">${empresaSlogan}</div>` : '';
    const empresaNomeHtml = empresaNome ? `<div class="empresa-nome">${empresaNome}</div>` : '';
    const formaPagamentoHtml = formaPagamento ? `<div class="forma-pagamento">Forma de Pagamento: ${formaPagamento}</div>` : '';
    const observacoesHtml = observacoes ? `<div class="observacao">Observações: ${observacoes}</div>` : '';
    
    function gerarReciboVia(via) {
        return `
            <div class="recibo-item">
                <div class="recibo-via">${via}</div>
                <div class="recibo-formal">
                    <div class="header">
                        <div class="logo-area-recibo">${logoSvg}</div>
                        <div class="titulo-area">
                            <h2>RECIBO</h2>
                            ${empresaNomeHtml}
                            ${sloganHtml}
                        </div>
                        <div style="width: 45px;"></div>
                    </div>
                    
                    <div class="info-topo">
                        <span class="numero-recibo">Número: ${numero}</span>
                        <span class="valor-recibo">R$ ${valorFormatado}</span>
                    </div>
                    
                    <div class="grid-info">
                        <div class="grid-label">Data:</div>
                        <div class="grid-value">${data}</div>
                        <div class="grid-label">Recebi de:</div>
                        <div class="grid-value">${recebidoDe}</div>
                        <div class="grid-label">Referente a:</div>
                        <div class="grid-value">${referente}</div>
                    </div>
                    
                    ${formaPagamentoHtml}
                    
                    <div class="extenso">
                        <div class="extenso-label">Recebi a quantia de</div>
                        <div class="extenso-value">${valorExt}</div>
                    </div>
                    
                    ${observacoesHtml}
                    
                    <div class="assinatura">
                        <p>Assinatura</p>
                    </div>
                    
                    <!-- NOME e CPF lado a lado -->
                    <div class="emitente-dados">
                        <div class="emitente-nome"><strong>Emitente:</strong> ${nome}</div>
                        <div class="emitente-cpf"><strong>CPF/CNPJ:</strong> ${cpf}</div>
                    </div>
                    
                    <div class="footer">
                        Emitido em ${dataHoje}
                    </div>
                </div>
            </div>
        `;
    }
    
    const html = `
        <div class="recibos-empilhados">
            ${gerarReciboVia('1ª VIA - CLIENTE')}
            ${gerarReciboVia('2ª VIA - EMITENTE')}
        </div>
    `;
    
    document.getElementById('recibosArea').innerHTML = html;
}

    window.print();
    setTimeout(() => {
        document.getElementById('numero').value = numeroAtual + 1;
        montarRecibos();

function toggleHistorico() {
    const panel = document.getElementById('historicoPanel');
    panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    if (panel.style.display === 'block') atualizarListaHistorico();
}

function carregarDados() {
    carregarLogo();
    
    const empresaNome = localStorage.getItem('empresaNome');
    const empresaSlogan = localStorage.getItem('empresaSlogan');
    if (empresaNome) document.getElementById('empresaNome').value = empresaNome;
    if (empresaSlogan) document.getElementById('empresaSlogan').value = empresaSlogan;
    
    const historicoSalvo = localStorage.getItem('recibosEmitidos');
    if (historicoSalvo) recibosEmitidos = JSON.parse(historicoSalvo);
    
    const salvos = localStorage.getItem('reciboDados');
    if (salvos) {
        const dados = JSON.parse(salvos);
        document.getElementById('numero').value = dados.numero || '1';
        document.getElementById('data').value = dados.data || '';
        document.getElementById('valor').value = dados.valor || '';
        document.getElementById('recebidoDe').value = dados.recebidoDe || '';
        document.getElementById('referente').value = dados.referente || '';
        document.getElementById('nome').value = dados.nome || '';
        document.getElementById('cpf').value = dados.cpf || '';
    }
    
    if (!document.getElementById('data').value) {
        const hoje = new Date();
        document.getElementById('data').value = `${hoje.getFullYear()}-${String(hoje.getMonth()+1).padStart(2,'0')}-${String(hoje.getDate()).padStart(2,'0')}`;
    }
    
    montarRecibos();
    atualizarListaHistorico();
}

// ==================== EVENTOS ====================
let timeoutSalvar;
function autoSalvar() {
    clearTimeout(timeoutSalvar);
    timeoutSalvar = setTimeout(() => {
        const dados = {
            numero: document.getElementById('numero').value,
            data: document.getElementById('data').value,
            valor: document.getElementById('valor').value,
            recebidoDe: document.getElementById('recebidoDe').value,
            referente: document.getElementById('referente').value,
            nome: document.getElementById('nome').value,
            cpf: document.getElementById('cpf').value
        };
        localStorage.setItem('reciboDados', JSON.stringify(dados));
        localStorage.setItem('empresaNome', document.getElementById('empresaNome').value);
        localStorage.setItem('empresaSlogan', document.getElementById('empresaSlogan').value);
        montarRecibos();
    }, 300);
}

document.getElementById('cpf').addEventListener('input', function() {
    this.value = aplicarMascaraCPF(this.value);
    autoSalvar();
});

document.getElementById('valor').addEventListener('input', function() {
    let valor = this.value.replace(/[^\d,]/g, '');
    const partes = valor.split(',');
    if (partes.length > 2) valor = partes[0] + ',' + partes.slice(1).join('');
    if (partes.length === 2 && partes[1].length > 2) valor = partes[0] + ',' + partes[1].substring(0, 2);
    this.value = valor;
    autoSalvar();
});

const campos = ['numero', 'data', 'recebidoDe', 'referente', 'observacoes', 'nome', 'formaPagamento', 'empresaNome', 'empresaSlogan'];
campos.forEach(id => {
    const campo = document.getElementById(id);
    if (campo) campo.addEventListener('input', autoSalvar);
});

// ==================== INICIALIZAR ====================
carregarDados();
</script>
